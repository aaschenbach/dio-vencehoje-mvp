name: Validate MVP

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - fix/build-and-financial-operations

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Unit tests
        if: always()
        run: bun run test
      - name: Build
        if: always()
        run: bun run build
